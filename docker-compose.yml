services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: permissionhub
      POSTGRES_PASSWORD: permissionhub
      POSTGRES_DB: permissionhub
    ports: ["5432:5432"]
    volumes: [permissionhub_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permissionhub"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [permissionhub_redis:/data]
volumes:
  permissionhub_postgres:
  permissionhub_redis:
