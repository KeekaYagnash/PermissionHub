name: PermissionHub deployment configuration preflight
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all required deployment configuration before expensive work
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION || 'af-south-1' }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || (inputs.environment == 'dev' && '143671530412' || '') }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-bucket' || '') }}
          STATE_KEY: ${{ vars.TF_STATE_KEY || (inputs.environment == 'dev' && 'permisionhub/dev/backend' || (inputs.environment == 'prod' && 'permisionhub/prod/backend' || '')) }}
          LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || (inputs.environment == 'dev' && 'permissionhub-state-lock' || '') }}
          LAMBDA_ARTIFACT_BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-lambda-artifacts' || '') }}
          CI_TF_VARS_JSON: ${{ vars.CI_TF_VARS_JSON }}
          PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
          INFRA_ROLE_ARN: ${{ vars.AWS_INFRA_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-terraform-dev' || '') }}
          BACKEND_ROLE_ARN: ${{ vars.AWS_BACKEND_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-backend-dev' || '') }}
          FRONTEND_ROLE_ARN: ${{ vars.AWS_FRONTEND_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-frontend-dev' || '') }}
        run: node infrastructure/scripts/ci.mjs preflight
