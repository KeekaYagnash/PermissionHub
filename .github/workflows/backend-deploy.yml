name: PermissionHub serverless deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_frontend_url: ${{ vars.TF_VAR_FRONTEND_URL }}
  TF_VAR_lambda_artifact_bucket: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}
  TF_VAR_api_lambda_artifact_key: permissionhub-api-${{ github.sha }}.zip
  TF_VAR_provisioning_lambda_artifact_key: permissionhub-provisioning-${{ github.sha }}.zip
  TF_VAR_expiry_lambda_artifact_key: permissionhub-expiry-${{ github.sha }}.zip
  TF_VAR_migration_lambda_artifact_key: permissionhub-db-migration-${{ github.sha }}.zip

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backend tests
        run: npm test --workspace backend

      - name: Backend build
        run: npm run build --workspace backend

      - name: Build Lambda bundles
        run: npm run build:lambda --workspace backend

      - name: Package Lambda artifacts
        run: |
          mkdir -p artifacts
          (cd backend/lambda-dist && zip -qr "../../artifacts/permissionhub-api-${{ github.sha }}.zip" .)
          cp "artifacts/permissionhub-api-${{ github.sha }}.zip" "artifacts/permissionhub-provisioning-${{ github.sha }}.zip"
          cp "artifacts/permissionhub-api-${{ github.sha }}.zip" "artifacts/permissionhub-expiry-${{ github.sha }}.zip"
          cp "artifacts/permissionhub-api-${{ github.sha }}.zip" "artifacts/permissionhub-db-migration-${{ github.sha }}.zip"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Lambda artifacts
        run: |
          aws s3 cp "artifacts/permissionhub-api-${{ github.sha }}.zip" "s3://${{ vars.LAMBDA_ARTIFACT_BUCKET }}/permissionhub-api-${{ github.sha }}.zip"
          aws s3 cp "artifacts/permissionhub-provisioning-${{ github.sha }}.zip" "s3://${{ vars.LAMBDA_ARTIFACT_BUCKET }}/permissionhub-provisioning-${{ github.sha }}.zip"
          aws s3 cp "artifacts/permissionhub-expiry-${{ github.sha }}.zip" "s3://${{ vars.LAMBDA_ARTIFACT_BUCKET }}/permissionhub-expiry-${{ github.sha }}.zip"
          aws s3 cp "artifacts/permissionhub-db-migration-${{ github.sha }}.zip" "s3://${{ vars.LAMBDA_ARTIFACT_BUCKET }}/permissionhub-db-migration-${{ github.sha }}.zip"

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=permissionhub/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TERRAFORM_LOCK_TABLE }}" \
            -backend-config="encrypt=true" \
            -reconfigure

      - name: Terraform plan
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform plan -no-color -var-file=terraform.tfvars.example \
            -var="frontend_url=${TF_VAR_frontend_url}" \
            -var="lambda_artifact_bucket=${TF_VAR_lambda_artifact_bucket}" \
            -var="api_lambda_artifact_key=${TF_VAR_api_lambda_artifact_key}" \
            -var="provisioning_lambda_artifact_key=${TF_VAR_provisioning_lambda_artifact_key}" \
            -var="expiry_lambda_artifact_key=${TF_VAR_expiry_lambda_artifact_key}" \
            -var="migration_lambda_artifact_key=${TF_VAR_migration_lambda_artifact_key}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: infrastructure/terraform/environments/dev
        run: terraform apply -auto-approve tfplan

      - name: Run database migrations
        working-directory: infrastructure/terraform/environments/dev
        run: |
          MIGRATION_LAMBDA="$(terraform output -raw migration_lambda_name)"
          RESPONSE="$(aws lambda invoke --function-name "${MIGRATION_LAMBDA}" /tmp/permissionhub-migration.json --output json)"
          echo "${RESPONSE}"
          cat /tmp/permissionhub-migration.json
          if echo "${RESPONSE}" | grep -q '"FunctionError"'; then
            exit 1
          fi

      - name: Build frontend for deployed infrastructure
        working-directory: infrastructure/terraform/environments/dev
        run: |
          FRONTEND_URL="$(terraform output -raw frontend_url)"
          API_ENDPOINT="$(terraform output -raw api_gateway_endpoint)"
          COGNITO_DOMAIN="$(terraform output -raw cognito_domain)"
          COGNITO_CLIENT_ID="$(terraform output -raw cognito_app_client_id)"
          cd ../../../..
          VITE_AUTH_MODE=cognito \
          VITE_API_BASE_URL="${API_ENDPOINT}/api" \
          VITE_COGNITO_DOMAIN="${COGNITO_DOMAIN}.auth.${{ vars.AWS_REGION }}.amazoncognito.com" \
          VITE_COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID}" \
          VITE_COGNITO_REDIRECT_URI="${FRONTEND_URL}/auth/callback" \
          VITE_COGNITO_LOGOUT_URI="${FRONTEND_URL}/login" \
          npm run build --workspace frontend

      - name: Upload frontend to S3
        working-directory: infrastructure/terraform/environments/dev
        run: |
          FRONTEND_BUCKET="$(terraform output -raw frontend_bucket_name)"
          DISTRIBUTION_ID="$(terraform output -raw frontend_cloudfront_distribution_id)"
          cd ../../../..
          aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}" --delete
          aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"

      - name: API health check
        working-directory: infrastructure/terraform/environments/dev
        run: |
          FRONTEND_URL="$(terraform output -raw frontend_url)"
          API_ENDPOINT="$(terraform output -raw api_gateway_endpoint)"
          curl --fail --retry 12 --retry-delay 10 "${API_ENDPOINT}/health"
          curl --fail --retry 12 --retry-delay 10 "${FRONTEND_URL}/"
