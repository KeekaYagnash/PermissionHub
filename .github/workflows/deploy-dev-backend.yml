name: PermissionHub Terraform-managed backend
on:
  workflow_call:
    outputs:
      fresh_deployment:
        description: Whether verified empty state selected the initial infrastructure deployment path
        value: ${{ jobs.prepare.outputs.fresh_deployment }}
      public_config:
        description: Public frontend configuration from this deployment (no secrets or state access required)
        value: ${{ jobs.apply.outputs.public_config || jobs.context.outputs.public_config }}
    inputs:
      migrations_validated:
        description: Same-commit validation workflow passed the empty-database migration checks
        type: boolean
        default: false
      defer_frontend:
        type: boolean
        default: false
      fresh_deployment:
        type: boolean
        default: false
      environment:
        type: string
        required: true
      backend:
        type: boolean
        default: true
      infrastructure:
        type: boolean
        default: false
      migrations:
        type: boolean
        default: false
      apply:
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  context:
    if: inputs.apply && !inputs.defer_frontend && !inputs.backend && !inputs.infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    outputs:
      public_config: ${{ steps.frontend.outputs.public_config }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'af-south-1' }}
      AWS_ACCOUNT_ID: ${{ (vars.AWS_ACCOUNT_ID || (inputs.environment == 'dev' && '143671530412' || '')) }}
      DEPLOY_ENV: ${{ inputs.environment }}
      LAMBDA_ARTIFACT_BUCKET: ${{ (vars.LAMBDA_ARTIFACT_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-lambda-artifacts' || '')) }}
      STATE_BUCKET: ${{ (vars.TF_STATE_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-bucket' || '')) }}
      STATE_KEY: ${{ (vars.TF_STATE_KEY || (inputs.environment == 'dev' && 'permisionhub/dev/backend' || (inputs.environment == 'prod' && 'permisionhub/prod/backend' || ''))) }}
      LOCK_TABLE: ${{ (vars.TF_LOCK_TABLE || (inputs.environment == 'dev' && 'permissionhub-state-lock' || '')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ (vars.AWS_PLAN_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-terraform-dev' || '')) }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Read public outputs only for a frontend-only release
        id: frontend
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        run: |
          node "$GITHUB_WORKSPACE/infrastructure/scripts/ci.mjs" backend-config
          terraform init -reconfigure -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$LOCK_TABLE" -backend-config="encrypt=true"
          node ../../../scripts/ci.mjs identity
          node ../../../scripts/ci.mjs frontend
  prepare:
    if: inputs.backend || inputs.infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    outputs:
      fresh_deployment: ${{ steps.references.outputs.fresh_deployment }}
    env: &deployment-env
      AWS_REGION: ${{ vars.AWS_REGION || 'af-south-1' }}
      AWS_ACCOUNT_ID: ${{ (vars.AWS_ACCOUNT_ID || (inputs.environment == 'dev' && '143671530412' || '')) }}
      STATE_BUCKET: ${{ (vars.TF_STATE_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-bucket' || '')) }}
      STATE_KEY: ${{ (vars.TF_STATE_KEY || (inputs.environment == 'dev' && 'permisionhub/dev/backend' || (inputs.environment == 'prod' && 'permisionhub/prod/backend' || ''))) }}
      LOCK_TABLE: ${{ (vars.TF_LOCK_TABLE || (inputs.environment == 'dev' && 'permissionhub-state-lock' || '')) }}
      DEPLOY_ENV: ${{ inputs.environment }}
      CI_TF_VARS_JSON: ${{ vars.CI_TF_VARS_JSON }}
      LAMBDA_ARTIFACT_BUCKET: ${{ (vars.LAMBDA_ARTIFACT_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-lambda-artifacts' || '')) }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit reviewed migrations for fresh apply
        if: inputs.fresh_deployment && inputs.apply
        env:
          MIGRATIONS: ${{ inputs.migrations }}
          READY: ${{ vars.CI_MIGRATIONS_READY || (inputs.environment == 'dev' && inputs.migrations_validated && 'true' || 'false') }}
        run: test "$MIGRATIONS" = true && test "$READY" = true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ (vars.AWS_ARTIFACT_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-backend-dev' || '')) }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws sts get-caller-identity
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Initialize existing remote state
        env:
          STATE_BUCKET: ${{ (vars.TF_STATE_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-bucket' || '')) }}
          STATE_KEY: ${{ (vars.TF_STATE_KEY || (inputs.environment == 'dev' && 'permisionhub/dev/backend' || (inputs.environment == 'prod' && 'permisionhub/prod/backend' || ''))) }}
          LOCK_TABLE: ${{ (vars.TF_LOCK_TABLE || (inputs.environment == 'dev' && 'permissionhub-state-lock' || '')) }}
        run: |
          node "$GITHUB_WORKSPACE/infrastructure/scripts/ci.mjs" backend-config
          terraform -chdir=infrastructure/terraform/environments/${{ inputs.environment }} init -reconfigure -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$LOCK_TABLE" -backend-config="encrypt=true"
      - name: Verify selected AWS identity and actual backend
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        run: node ../../../scripts/ci.mjs identity
      - uses: actions/download-artifact@v4
        with:
          name: lambda-build-${{ github.sha }}
          path: artifacts
      - name: Resolve existing or immutable new artifact references
        id: references
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        env:
          ALLOW_FRESH_DEPLOYMENT: ${{ inputs.fresh_deployment }}
          AUTO_BOOTSTRAP_DEV: ${{ inputs.environment == 'dev' && 'true' || 'false' }}
          DEPLOY_APPLY: ${{ inputs.apply }}
          CI_MIGRATIONS_READY: ${{ vars.CI_MIGRATIONS_READY || (inputs.environment == 'dev' && inputs.migrations_validated && 'true' || 'false') }}
          ARTIFACT_MODE: ${{ inputs.backend && 'built' || 'state' }}
        run: node ../../../scripts/ci.mjs refs "$RUNNER_TEMP/artifacts.tfvars.json" "$ARTIFACT_MODE"
      - name: Upload only changed artifacts with create-only S3 writes
        if: inputs.backend || steps.references.outputs.fresh_deployment == 'true'
        run: node infrastructure/scripts/ci.mjs upload "$RUNNER_TEMP/artifacts.tfvars.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-references
          path: ${{ runner.temp }}/artifacts.tfvars.json
          retention-days: 1
  migrate:
    if: (inputs.backend || inputs.migrations) && inputs.apply && needs.prepare.outputs.fresh_deployment != 'true'
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    env: *deployment-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ (vars.AWS_BACKEND_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-backend-dev' || '')) }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws sts get-caller-identity
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Initialize existing remote state
        env:
          STATE_BUCKET: ${{ (vars.TF_STATE_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-bucket' || '')) }}
          STATE_KEY: ${{ (vars.TF_STATE_KEY || (inputs.environment == 'dev' && 'permisionhub/dev/backend' || (inputs.environment == 'prod' && 'permisionhub/prod/backend' || ''))) }}
          LOCK_TABLE: ${{ (vars.TF_LOCK_TABLE || (inputs.environment == 'dev' && 'permissionhub-state-lock' || '')) }}
        run: |
          node "$GITHUB_WORKSPACE/infrastructure/scripts/ci.mjs" backend-config
          terraform -chdir=infrastructure/terraform/environments/${{ inputs.environment }} init -reconfigure -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$LOCK_TABLE" -backend-config="encrypt=true"
      - uses: actions/download-artifact@v4
        with:
          name: lambda-references
          path: ${{ runner.temp }}
      - name: Update only the migration Lambda using a guarded saved plan
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        env:
          RUN_MIGRATIONS: ${{ inputs.migrations }}
          CI_MIGRATIONS_READY: ${{ vars.CI_MIGRATIONS_READY || (inputs.environment == 'dev' && inputs.migrations_validated && 'true' || 'false') }}
        run: |
          node ../../../scripts/ci.mjs identity
          node ../../../scripts/ci.mjs config "$RUNNER_TEMP/config.tfvars.json"
          terraform plan -input=false -lock-timeout=5m -target=module.migration_lambda -var-file="$RUNNER_TEMP/config.tfvars.json" -var-file="$RUNNER_TEMP/artifacts.tfvars.json" -out="$RUNNER_TEMP/migration.tfplan"
          terraform show -json "$RUNNER_TEMP/migration.tfplan" > "$RUNNER_TEMP/migration-plan.json"
          node ../../../scripts/ci.mjs guard "$RUNNER_TEMP/migration-plan.json" migration
          terraform apply -input=false "$RUNNER_TEMP/migration.tfplan"
          node ../../../scripts/ci.mjs migrate
  plan:
    if: always() && needs.prepare.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    needs: [prepare, migrate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    env: *deployment-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ (vars.AWS_PLAN_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-terraform-dev' || '')) }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws sts get-caller-identity
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Initialize existing remote state
        env:
          STATE_BUCKET: ${{ (vars.TF_STATE_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-bucket' || '')) }}
          STATE_KEY: ${{ (vars.TF_STATE_KEY || (inputs.environment == 'dev' && 'permisionhub/dev/backend' || (inputs.environment == 'prod' && 'permisionhub/prod/backend' || ''))) }}
          LOCK_TABLE: ${{ (vars.TF_LOCK_TABLE || (inputs.environment == 'dev' && 'permissionhub-state-lock' || '')) }}
        run: |
          node "$GITHUB_WORKSPACE/infrastructure/scripts/ci.mjs" backend-config
          terraform -chdir=infrastructure/terraform/environments/${{ inputs.environment }} init -reconfigure -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$LOCK_TABLE" -backend-config="encrypt=true"
      - uses: actions/download-artifact@v4
        with:
          name: lambda-references
          path: ${{ runner.temp }}
      - name: Create and inspect saved deployment plan
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        env:
          PLAN_MODE: ${{ (inputs.infrastructure || needs.prepare.outputs.fresh_deployment == 'true') && 'infrastructure' || 'backend' }}
        run: |
          node ../../../scripts/ci.mjs identity
          node ../../../scripts/ci.mjs config "$RUNNER_TEMP/config.tfvars.json"
          terraform validate
          terraform plan -input=false -lock=false -var-file="$RUNNER_TEMP/config.tfvars.json" -var-file="$RUNNER_TEMP/artifacts.tfvars.json" -out="$RUNNER_TEMP/deployment.tfplan"
          terraform show -json "$RUNNER_TEMP/deployment.tfplan" > "$RUNNER_TEMP/deployment-plan.json"
          node ../../../scripts/ci.mjs guard "$RUNNER_TEMP/deployment-plan.json" "$PLAN_MODE"
      - name: Encrypt sensitive saved plan before artifact storage
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: node infrastructure/scripts/ci.mjs seal-plan "$RUNNER_TEMP/deployment.tfplan" "$RUNNER_TEMP/deployment.tfplan.encrypted"
      - uses: actions/upload-artifact@v4
        with:
          name: saved-deployment-plan
          path: ${{ runner.temp }}/deployment.tfplan.encrypted
          retention-days: 1
      - run: echo "Saved plan passed the destruction/replacement guard. Apply requires the deployment environment gate." >> "$GITHUB_STEP_SUMMARY"
  apply:
    if: inputs.apply
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    outputs:
      public_config: ${{ steps.frontend.outputs.public_config }}
    environment: ${{ inputs.environment == 'dev' && 'development' || 'production' }}
    env: *deployment-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ (inputs.infrastructure || needs.prepare.outputs.fresh_deployment == 'true') && (vars.AWS_INFRA_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-terraform-dev' || '')) || (vars.AWS_BACKEND_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-backend-dev' || '')) }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws sts get-caller-identity
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Initialize existing remote state
        env:
          STATE_BUCKET: ${{ (vars.TF_STATE_BUCKET || (inputs.environment == 'dev' && 'permissionhub-dev-bucket' || '')) }}
          STATE_KEY: ${{ (vars.TF_STATE_KEY || (inputs.environment == 'dev' && 'permisionhub/dev/backend' || (inputs.environment == 'prod' && 'permisionhub/prod/backend' || ''))) }}
          LOCK_TABLE: ${{ (vars.TF_LOCK_TABLE || (inputs.environment == 'dev' && 'permissionhub-state-lock' || '')) }}
        run: |
          node "$GITHUB_WORKSPACE/infrastructure/scripts/ci.mjs" backend-config
          terraform -chdir=infrastructure/terraform/environments/${{ inputs.environment }} init -reconfigure -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$LOCK_TABLE" -backend-config="encrypt=true"
      - uses: actions/download-artifact@v4
        with:
          name: saved-deployment-plan
          path: ${{ runner.temp }}
      - name: Decrypt and authenticate the exact commit-bound plan
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: node infrastructure/scripts/ci.mjs open-plan "$RUNNER_TEMP/deployment.tfplan.encrypted" "$RUNNER_TEMP/deployment.tfplan"
      - name: Apply exact reviewed plan
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        run: |
          node ../../../scripts/ci.mjs identity
          terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/deployment.tfplan"
      - name: Use backend deployment identity for approved fresh database initialization
        if: needs.prepare.outputs.fresh_deployment == 'true'
        uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ (vars.AWS_BACKEND_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::143671530412:role/permissionhub-github-backend-dev' || '')) }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize a fresh database only after infrastructure exists
        if: needs.prepare.outputs.fresh_deployment == 'true'
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        env:
          RUN_MIGRATIONS: 'true'
          CI_MIGRATIONS_READY: ${{ vars.CI_MIGRATIONS_READY || (inputs.environment == 'dev' && inputs.migrations_validated && 'true' || 'false') }}
        run: node ../../../scripts/ci.mjs migrate
      - name: Verify API and report frontend outputs
        id: frontend
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        env:
          DEFER_FRONTEND: ${{ inputs.defer_frontend }}
        run: |
          node ../../../scripts/ci.mjs health
          node ../../../scripts/ci.mjs frontend
          echo "Terraform-managed backend deployment completed for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
